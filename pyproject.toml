[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo2file"
version = "2.0.0"
description = "Repository content dumper for LLM prompts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pathspec>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
repo2file = "repo2file.cli:main"

[project.urls]
Homepage = "https://github.com/awdemos/repo2file"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=repo2file --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["repo2file"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
